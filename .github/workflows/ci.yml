name: CI
permissions:
  contents: read

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: ["*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    name: Format, Lint, Test and Build
    runs-on: ubuntu-latest
    
    environment: 
      name: staging
      deployment: false

    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_ALLOWED_HOSTS: localhost:3000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_ENV: staging

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install zizmor
        run: python3 -m pip install --user zizmor==1.29.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workflows
        run: pnpm run lint:workflows

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome
        run: pnpm exec biome ci .

      - name: Check dependency consistency
        run: pnpm run deps:check

      - name: Check unused files
        run: pnpm run deps:unused

      - name: Type check
        run: pnpm run check-types

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Generate worker types
        run: pnpm run cf:typegen

      - name: Validate Cloudflare Worker
        run: pnpm run cf:validate

      - name: Audit dependencies
        run: pnpm run security:audit
