name: E2E Tests
permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect E2E-relevant changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
 
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'e2e/**'
              - 'playwright.config.*'
              - 'scripts/write-e2e-worker-vars.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/e2e-tests.yml'
              - 'packages/**'
              - 'apps/**'
              
  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    
    runs-on: ubuntu-latest
    environment: staging
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_ALLOWED_HOSTS: localhost:3000
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_GITHUB_CLIENT_ID: ${{ secrets.BETTER_AUTH_GITHUB_CLIENT_ID }}
      BETTER_AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.BETTER_AUTH_GITHUB_CLIENT_SECRET }}
      BETTER_AUTH_GOOGLE_CLIENT_ID: ${{ secrets.BETTER_AUTH_GOOGLE_CLIENT_ID }}
      BETTER_AUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.BETTER_AUTH_GOOGLE_CLIENT_SECRET }}
      E2E_PORT: 3000
      APP_ENV: staging

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Drizzle migrations
        run: pnpm run db:generate

      - name: Synchronize test database schema
        run: pnpm run db:push

      - name: Provide Worker variables for E2E
        run: pnpm exec tsx scripts/write-e2e-worker-vars.ts

      - name: Run E2E tests
        run: pnpm run test:e2e
