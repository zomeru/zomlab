name: Deploy Workers

on:
  push:
    branches: [dev, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Drizzle migrations
        run: pnpm exec turbo run db:check --filter=@zomlab/database

      - name: Apply Drizzle migrations
        run: pnpm run db:migrate

      - name: Deploy staging Worker
        if: github.ref_name == 'dev'
        run: pnpm run deploy

      - name: Deploy production Worker
        if: github.ref_name == 'main'
        run: pnpm run deploy:production
