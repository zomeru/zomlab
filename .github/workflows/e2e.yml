name: E2E Tests
permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:
    branches: ["*"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    environment: staging
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_ALLOWED_HOSTS: localhost:3100
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      E2E_PORT: 3100
      APP_ENV: ${{ vars.APP_ENV }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Drizzle migrations
        run: pnpm run db:generate

      - name: Synchronize test database schema
        run: pnpm run db:push

      - name: Provide Worker variables for E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          {
            printf 'DATABASE_URL="%s"\n' "$DATABASE_URL"
            printf 'BETTER_AUTH_SECRET="%s"\n' "$BETTER_AUTH_SECRET"
            printf 'BETTER_AUTH_URL="http://localhost:3100"\n'
            printf 'BETTER_AUTH_ALLOWED_HOSTS="localhost:3100"\n'
            printf 'E2E_PORT="3100"\n'
            printf 'APP_ENV="%s"\n' "$APP_ENV"
          } > apps/web/.dev.vars

      - name: Run E2E tests
        run: pnpm run test:e2e
