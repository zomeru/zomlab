packages:
  - "apps/*"
  - "packages/*"

sharedWorkspaceLockfile: true
linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling
strictPeerDependencies: true
autoInstallPeers: false
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
pmOnFail: error

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  workerd: true

overrides:
  postcss: ^8.5.24
  sharp: ^0.35.3
  uuid: ^14.0.1

minimumReleaseAgeExclude:
  - hono@4.13.0
  - '@tanstack/react-start-rsc@0.1.34'
  - '@tanstack/react-start-server@1.167.23'
  - '@tanstack/react-start@1.168.35'
  - '@tanstack/start-plugin-core@1.171.26'
  - '@tanstack/start-server-core@1.169.18'
  - '@storybook/builder-vite@10.5.6'
  - '@storybook/csf-plugin@10.5.6'
  - '@storybook/react-dom-shim@10.5.6'
  - '@storybook/react-vite@10.5.6'
  - '@storybook/react@10.5.6'
  - storybook@10.5.6
